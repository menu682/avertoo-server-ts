services:
  postgres:
    image: postgres:18
    container_name: avertoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avertoo
      POSTGRES_USER: avertoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: